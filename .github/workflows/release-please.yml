name: Release Please

# Only this workflow creates a release tag. It bumps the version, writes the
# changelog, creates the tag together with a draft release, and then starts the
# release pipeline against that tag.
#
# The pipeline in release.yml has no tag trigger of its own on purpose: with
# one, every tag creation would run two pipelines in parallel.
#
# `draft: true` and `force-tag-creation: true` belong together and neither may
# be dropped. The draft keeps the release invisible until the artifacts hang on
# it. Without force-tag-creation the tag would appear only when the draft is
# published, and release-please determines what has already been released from
# tags: after cutting a draft without a tag it treated the whole history as
# unreleased and opened a follow-up release pull request with 44 changelog
# entries.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN. GitHub suppresses workflow runs
      # for events created with GITHUB_TOKEN as a recursion guard, so CI would
      # never run on the release pull request and its required checks would
      # never appear. An app token is a real actor and triggers CI.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          # The client id is public information, so it is a variable rather
          # than a secret: the standard's own rule is that values which are
          # not secret must not be secrets, because a secret cannot be shown
          # in an error message and makes every check blind.
          #
          # `client-id`, not `app-id`. The action deprecates the latter, and the
          # two carry different values rather than two names for one thing.
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch:
    name: Start the release pipeline
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Run release.yml against the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # force-tag-creation means the tag exists at this point. Fail here
          # rather than let the pipeline start against a ref that is not there.
          for attempt in {1..20}; do
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1 && break
            if [[ "$attempt" == 20 ]]; then
              echo "::error::tag ${TAG} does not exist; is force-tag-creation still set?"
              exit 1
            fi
            sleep 5
          done
          # Note the newest run first, so the dispatch can be shown to have
          # taken effect. A dispatch that silently does nothing would leave the
          # release sitting as a draft without assets and without a signal.
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=release.yml \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          for attempt in {1..12}; do
            sleep 10
            after=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=release.yml \
              --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [[ "$after" != "$before" ]]; then
              printf 'dispatched release.yml against %s, run %s\n' "$TAG" "$after"
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::the dispatch of release.yml produced no run within 120s"
              exit 1
            fi
          done
