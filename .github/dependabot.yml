version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # The MSRV job pins dtolnay/rust-toolchain@1.88 deliberately. For this
      # action the ref selects the toolchain to test against, it is not a
      # version to keep current, so a bump would silently raise the minimum
      # supported Rust version instead of updating an action.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
