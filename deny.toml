# cargo-deny. Prüft Advisories, Lizenzen, Duplikate und Registries.
# Jeder Eintrag unter `ignore` braucht Begründung, betroffenes Crate und
# die Bedingung, unter der er wieder entfernt wird.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Beispielform, bei Übernahme entfernen:
    # { id = "RUSTSEC-0000-0000", reason = "kein Patch verfügbar; über <crate> gezogen; entfernen sobald <crate> auf <version> ist" },
]

[licenses]
version = 2
# png2lvgl ist eine Anwendung unter GPL-3.0-or-later, deshalb steht die eigene
# Lizenz mit in der Liste; sonst schlägt der Check am eigenen Crate fehl.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
